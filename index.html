<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonidos de Tarapoto</title>
<meta name="description" content="El sonido de la selva alta: catarata, lluvia y música típica de Tarapoto.">
<meta name="theme-color" content="#06281d">
<meta property="og:title" content="Sonidos de Tarapoto">
<meta property="og:description" content="Catarata, lluvia y música típica de la selva alta. Toca para escuchar.">
<meta property="og:type" content="website">
<style>
  :root{
    --verde-hondo:#06281d;
    --verde:#0f5137;
    --verde-claro:#38c48a;
    --agua:#7fe3d0;
    --ambar:#f6b24b;
    --crema:#f3efe3;
    --tinta:#eafff6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--tinta);
    background:#06281d;
    min-height:100dvh;
    overflow:hidden;
    position:relative;
    -webkit-tap-highlight-color:transparent;
  }

  /* ===== Escena de fondo ===== */
  .escena{position:fixed;inset:0;z-index:0;overflow:hidden}
  .cielo{
    position:absolute;inset:0;
    background:
      radial-gradient(130% 80% at 50% -10%, #1b7a57 0%, #0c4531 42%, #06281d 78%);
  }
  .sol{
    position:absolute;top:-14vh;left:50%;transform:translateX(-50%);
    width:52vmin;height:52vmin;border-radius:50%;
    background:radial-gradient(circle, rgba(246,178,75,.55), rgba(246,178,75,0) 62%);
    filter:blur(6px);
  }
  svg.cerros{position:absolute;bottom:0;left:0;width:100%;height:62vh;display:block}

  /* Catarata */
  .catarata{
    position:absolute;bottom:14vh;left:50%;transform:translateX(-50%);
    width:14vmin;height:40vh;border-radius:40% 40% 20% 20%;
    background:linear-gradient(to bottom, rgba(234,255,246,.0), rgba(234,255,246,.55) 20%, rgba(127,227,208,.65));
    filter:blur(.4px);
    overflow:hidden;opacity:.85;
  }
  .catarata::before,.catarata::after{
    content:"";position:absolute;inset:-20% 0;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.0) 0, rgba(255,255,255,.35) 6px, rgba(255,255,255,0) 14px);
    animation:caer 1.1s linear infinite;
  }
  .catarata::after{animation-duration:.7s;opacity:.6;background-size:100% 60%}
  @keyframes caer{from{transform:translateY(-30%)}to{transform:translateY(30%)}}
  .neblina{
    position:absolute;bottom:10vh;left:50%;transform:translateX(-50%);
    width:40vmin;height:14vh;border-radius:50%;
    background:radial-gradient(circle, rgba(234,255,246,.4), rgba(234,255,246,0) 70%);
    filter:blur(10px);animation:respira 6s ease-in-out infinite;
  }
  @keyframes respira{0%,100%{opacity:.35;transform:translateX(-50%) scale(1)}50%{opacity:.6;transform:translateX(-50%) scale(1.12)}}

  /* Lluvia */
  .lluvia{position:absolute;inset:0;pointer-events:none;opacity:.5}
  .lluvia i{
    position:absolute;top:-12%;width:1px;height:12vh;
    background:linear-gradient(rgba(190,240,230,0), rgba(190,240,230,.7));
    animation:gotas linear infinite;
  }
  @keyframes gotas{to{transform:translateY(130vh)}}

  /* Luciérnagas */
  .luz{position:absolute;width:5px;height:5px;border-radius:50%;
    background:radial-gradient(circle,#fff6d8,rgba(246,178,75,.2) 60%,transparent 70%);
    filter:blur(.3px);animation:flotar ease-in-out infinite}
  @keyframes flotar{
    0%{transform:translate(0,0);opacity:0}
    20%{opacity:1}
    50%{transform:translate(14px,-22px);opacity:.9}
    80%{opacity:.5}
    100%{transform:translate(-10px,-44px);opacity:0}
  }

  /* ===== Contenido ===== */
  .wrap{
    position:relative;z-index:2;
    min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:max(24px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));
    text-align:center;gap:26px;
  }
  .lugar{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--agua);opacity:.9;
  }
  .lugar::before,.lugar::after{content:"";width:28px;height:1px;background:currentColor;opacity:.6}
  h1{
    font-size:clamp(44px,15vw,88px);line-height:.95;font-weight:800;
    letter-spacing:-.01em;
    background:linear-gradient(180deg,#fff,#bff3e2);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 30px rgba(0,0,0,.25);
  }
  .sub{max-width:22ch;font-size:clamp(15px,4.2vw,18px);color:var(--crema);opacity:.92;line-height:1.5}

  /* Reproductor */
  .player{
    width:min(92vw,420px);
    background:rgba(8,40,30,.46);
    border:1px solid rgba(127,227,208,.22);
    border-radius:26px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    padding:26px 24px 22px;
    display:flex;flex-direction:column;align-items:center;gap:20px;
  }
  .btn{
    position:relative;appearance:none;border:0;cursor:pointer;
    width:104px;height:104px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #4fe0a6, #0f9b63 70%);
    box-shadow:0 10px 30px rgba(15,155,99,.5), inset 0 2px 6px rgba(255,255,255,.4);
    display:grid;place-items:center;color:#06281d;
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .btn:active{transform:scale(.95)}
  .btn svg{width:42px;height:42px;margin-left:3px}
  .btn.playing svg{margin-left:0}
  .btn::after{
    content:"";position:absolute;inset:-10px;border-radius:50%;
    border:2px solid rgba(127,227,208,.5);opacity:0;
  }
  .btn.playing::after{animation:pulso 1.8s ease-out infinite}
  @keyframes pulso{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}

  .barra{width:100%;display:flex;flex-direction:column;gap:9px}
  .pista{
    --p:0%;
    position:relative;width:100%;height:7px;border-radius:999px;cursor:pointer;
    background:rgba(234,255,246,.18);overflow:hidden;
  }
  .relleno{position:absolute;inset:0;width:var(--p);border-radius:999px;
    background:linear-gradient(90deg,var(--agua),var(--verde-claro));}
  .tiempos{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;
    font-size:12.5px;color:var(--crema);opacity:.85}
  .hint{font-size:12.5px;color:var(--agua);opacity:.75;letter-spacing:.02em}
  .pie{position:relative;z-index:2;font-size:12px;color:rgba(234,255,246,.55);padding-bottom:10px;display:flex;flex-direction:column;align-items:center;gap:5px}
  .creditos{max-width:34ch;font-size:10.5px;line-height:1.45;color:rgba(234,255,246,.4)}
  .creditos a{color:rgba(127,227,208,.6);text-decoration:none}
  @media (prefers-reduced-motion:reduce){
    .catarata::before,.catarata::after,.neblina,.luz,.lluvia i,.btn.playing::after{animation:none}
  }
</style>
</head>
<body>
  <div class="escena" aria-hidden="true">
    <div class="cielo"></div>
    <div class="sol"></div>
    <div class="catarata"></div>
    <div class="neblina"></div>
    <svg class="cerros" viewBox="0 0 1440 620" preserveAspectRatio="xMidYMax slice">
      <path fill="#0b3d2c" d="M0,300 C220,220 360,340 560,300 C760,260 900,360 1120,300 C1300,250 1380,320 1440,300 L1440,620 L0,620 Z"/>
      <path fill="#0a3326" d="M0,380 C200,330 420,430 640,390 C860,350 1040,440 1240,400 C1340,380 1400,410 1440,400 L1440,620 L0,620 Z"/>
      <path fill="#072b20" d="M0,470 C260,430 440,510 720,470 C980,435 1160,520 1440,480 L1440,620 L0,620 Z"/>
    </svg>
    <div class="lluvia" id="lluvia"></div>
  </div>

  <main class="wrap">
    <span class="lugar">Selva alta · Perú</span>
    <h1>Tarapoto</h1>
    <p class="sub">El sonido de la selva: una catarata, la lluvia y música típica.</p>

    <section class="player" aria-label="Reproductor de audio">
      <button class="btn" id="btn" aria-label="Reproducir">
        <svg id="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="barra">
        <div class="pista" id="pista" role="slider" aria-label="Avance" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <div class="relleno" id="relleno"></div>
        </div>
        <div class="tiempos"><span id="actual">0:00</span><span id="total">2:37</span></div>
      </div>
      <span class="hint" id="hint">Toca para escuchar 🎧</span>
    </section>
  </main>
  <footer class="pie">
    <span>Hecho con cariño 🌿</span>
    <span class="creditos">Sonidos: «Catarata Pacchacc» de Yupanasimi y «29 de setiembre» de Abel C. Apaza Amanqui (<a href="https://creativecommons.org/licenses/by-sa/4.0" target="_blank" rel="noopener">CC BY-SA 4.0</a>); lluvia por NASA (dominio público).</span>
  </footer>

  <audio id="audio" src="assets/tarapoto.mp3" preload="auto"></audio>

<script>
(function(){
  var audio=document.getElementById('audio');
  var btn=document.getElementById('btn');
  var ico=document.getElementById('ico');
  var pista=document.getElementById('pista');
  var relleno=document.getElementById('relleno');
  var actual=document.getElementById('actual');
  var total=document.getElementById('total');
  var hint=document.getElementById('hint');
  var PLAY='M8 5v14l11-7z';
  var PAUSE='M6 5h4v14H6zM14 5h4v14h-4z';

  function fmt(s){if(!isFinite(s))return'0:00';s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);}

  audio.addEventListener('loadedmetadata',function(){total.textContent=fmt(audio.duration);});
  audio.addEventListener('timeupdate',function(){
    var p=audio.duration?(audio.currentTime/audio.duration*100):0;
    relleno.style.width=p+'%';
    pista.style.setProperty('--p',p+'%');
    pista.setAttribute('aria-valuenow',Math.round(p));
    actual.textContent=fmt(audio.currentTime);
  });
  audio.addEventListener('play',function(){
    btn.classList.add('playing');ico.firstElementChild.setAttribute('d',PAUSE);
    btn.setAttribute('aria-label','Pausar');hint.style.display='none';
  });
  audio.addEventListener('pause',function(){
    btn.classList.remove('playing');ico.firstElementChild.setAttribute('d',PLAY);
    btn.setAttribute('aria-label','Reproducir');
  });
  audio.addEventListener('ended',function(){audio.currentTime=0;});

  function toggle(){ if(audio.paused){audio.play().catch(function(){hint.textContent='Toca de nuevo para reproducir';hint.style.display='';});} else {audio.pause();} }
  btn.addEventListener('click',toggle);

  function seek(clientX){
    var r=pista.getBoundingClientRect();
    var ratio=Math.min(1,Math.max(0,(clientX-r.left)/r.width));
    if(audio.duration){audio.currentTime=ratio*audio.duration;}
  }
  pista.addEventListener('click',function(e){seek(e.clientX);});
  pista.addEventListener('keydown',function(e){
    if(!audio.duration)return;
    if(e.key==='ArrowRight'){audio.currentTime=Math.min(audio.duration,audio.currentTime+5);}
    if(e.key==='ArrowLeft'){audio.currentTime=Math.max(0,audio.currentTime-5);}
    if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle();}
  });

  // Lluvia
  var ll=document.getElementById('lluvia'),frag=document.createDocumentFragment();
  for(var i=0;i<26;i++){var d=document.createElement('i');
    d.style.left=(Math.random()*100)+'%';
    d.style.animationDuration=(0.6+Math.random()*0.7)+'s';
    d.style.animationDelay=(Math.random()*2)+'s';
    d.style.opacity=(0.3+Math.random()*0.5);
    frag.appendChild(d);}
  ll.appendChild(frag);
  // Luciérnagas
  var esc=document.querySelector('.escena');
  for(var j=0;j<14;j++){var g=document.createElement('span');g.className='luz';
    g.style.left=(Math.random()*100)+'%';
    g.style.top=(45+Math.random()*50)+'%';
    g.style.animationDuration=(5+Math.random()*6)+'s';
    g.style.animationDelay=(Math.random()*6)+'s';
    esc.appendChild(g);}
})();
</script>
</body>
</html>
